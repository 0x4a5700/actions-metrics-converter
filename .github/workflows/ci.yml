name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: cd app && go vet ./...

      - name: Test
        run: cd app && go test ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
      - release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Lint Dockerfile
        run: docker build --check .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.published == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # Attestation manifests (platform unknown/unknown) break image pulls
          # on containerd versions that predate OCI artifact support, failing
          # pods with "no command specified".
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            gitHash=${{ github.sha }}
            buildVersion=${{ needs.release.outputs.published == 'true' && needs.release.outputs.version || github.sha }}

  helm:
    runs-on: ubuntu-latest
    needs:
      - test
      - release
      - docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/actions-metrics-converter

      - name: Log in to GHCR
        if: needs.release.outputs.published == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          VERSION="${{ needs.release.outputs.published == 'true' && needs.release.outputs.version || '0.0.0-dev' }}"
          helm package charts/actions-metrics-converter \
            --version "$VERSION" --app-version "$VERSION" \
            --destination /tmp/helm-packages

      - name: Push chart
        if: needs.release.outputs.published == 'true'
        # Charts get their own OCI namespace; pushing to the repository owner
        # root would land the chart in the same repo as the docker image and
        # overwrite its version tag.
        run: helm push /tmp/helm-packages/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
