replicaCount: 1

image:
  repository: ghcr.io/0x4a5700/actions-metrics-converter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The webhook secret shared with GitHub, used to verify X-Hub-Signature-256.
githubWebhookSecret:
  # Name of an existing Secret to read the webhook secret from. If set, no
  # Secret is created and `value` is ignored.
  existingSecret: ""
  # Key within the Secret holding the webhook secret.
  key: webhook-secret
  # Plain value used to create a Secret when existingSecret is not set.
  value: ""

otel:
  # Sets OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://otel-collector.observability:4318
  exporterOtlpEndpoint: ""

# Extra environment variables for the container, e.g. other OTEL_* settings.
extraEnv: []
# - name: OTEL_EXPORTER_OTLP_HEADERS
#   value: "x-honeycomb-team=..."

service:
  type: ClusterIP
  port: 80

# Exposes the service through a Contour HTTPProxy.
ingress:
  enabled: false
  # Fully qualified domain name of the virtual host, e.g. actions-metrics.example.com
  host: ""
  annotations: {}
  tls:
    # Name of a Secret containing the TLS certificate, or a cert-manager
    # Certificate's secretName. Leave empty for plain HTTP.
    secretName: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources: {}
# limits:
#   memory: 128Mi
# requests:
#   cpu: 50m
#   memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

nodeSelector: {}
tolerations: []
affinity: {}
